name: Investigate v8.3.2 NA feasibility

on:
  workflow_dispatch:
  push:
    branches: [codex/llbot-8.3.2-na]
    paths:
      - '.github/workflows/investigate-na.yml'
      - 'script/na-investigation/**'

permissions:
  contents: read

concurrency:
  group: llbot-na-investigation
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'mlpoki/LuckyLilliaBot'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: dc2b2b90092ef0f571b5546878288b83fff1e436
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download fixed packages and inspect bytes without execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python script/na-investigation/inventory.py
      - name: Read PE version resources without loading code
        shell: pwsh
        run: |
          $items = Get-ChildItem evidence/binaries -Recurse -File | ForEach-Object {
            $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($_.FullName)
            [ordered]@{path=$_.FullName.Substring((Get-Location).Path.Length + 1); fileVersion=$v.FileVersion; productVersion=$v.ProductVersion; originalFilename=$v.OriginalFilename; productName=$v.ProductName}
          }
          ConvertTo-Json -InputObject @($items) -Depth 5 | Set-Content evidence/pe-versions.json
      - name: Test public TypeScript adapter against loopback fixture only
        run: node --experimental-vm-modules script/na-investigation/adapter-test.mjs
      - name: Run existing mirror regression tests
        run: python -m unittest discover -s script/release-mirror -p "test_*.py" -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: na-feasibility-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
