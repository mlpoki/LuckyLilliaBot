name: Mirror upstream release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: llbot-release-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'mlpoki/LuckyLilliaBot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Test mirror behavior
        run: python3 -m unittest discover -s script/release-mirror -p 'test_*.py' -v
      - name: Mirror latest official release
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 script/release-mirror/mirror.py
      - name: Preserve verification and partial progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-mirror-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llbot-mirror/evidence.json
          if-no-files-found: warn
