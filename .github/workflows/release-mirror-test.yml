name: Test release mirror

on:
  push:
    branches: [codex/fork-release-mirror]
    paths:
      - 'script/release-mirror/**'
      - '.github/workflows/release-mirror-test.yml'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'mlpoki/LuckyLilliaBot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s script/release-mirror -p 'test_*.py' -v
